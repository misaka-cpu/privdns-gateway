name: CI

# 纯静态校验: 不启动 mosdns / sing-box / nftables, 只检查能不能编译 / 语法 / 渲染。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # 严格模式: 缺钉死版内核 = 失败。开发者本机单跑时不设它, 那时缺二进制记 [SKIP]。
      PDG_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # 跨版本快照矩阵要从**仓库最早那个提交**取真实的 deploy/dnsdist/dnsdist.conf,
          # 各版本 cmd_snapshot 的清单也靠历史对象解析。默认浅克隆拿不到, 于是 legacy 样本
          # 造不出来、后面的用例撞 FileNotFoundError。e2e job 早就因同样原因设了 0。
          fetch-depth: 0
      # Ubuntu 24.04 起 AppArmor 默认禁掉非特权用户命名空间, 而 lint 里有三支测试要用它把
      # /var/lib 与 /run 铺成真实可写的目录, 才能把「采集器一个字节都不写」证成非空转
      # (test-link-status / test-probe81-platform / test-config-transaction-faults)。
      # 没有这个能力那条判据就没跑 —— 分支第一次推上远端时 lint 就栽在这儿。
      #
      # **只放在直接跑在 runner 上的 job 里。** e2e / e2e-serial / e2e-rescue-lock-ios 跑在
      # debian:12 容器中、本身就是 root 且隔离(见 e2e job 顶上那段说明), 容器里没有 sudo ——
      # 往那些 job 里加这步会让它们在第一步就整个挂掉。这个错误犯过一次: run 30999183512
      # 里 20 个 E2E job 全红, 原因与被测代码无关。
      - name: "放开非特权用户命名空间 (多支测试靠它把只读纪律证成非空转)"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rm -- sh -c 'echo userns OK'
      # 事务的 mosdns_probe 校验器会**真的启动 mosdns** 解析候选配置, 拿不到二进制整笔事务
      # REFUSED。这条以前没有 —— 本地一直绿是因为开发机上有早前 E2E 留下的 mosdns, 而
      # CI 的 lint job 里没有, 于是 test-cidr-transaction 一串失败。v1.7.0 发布前的
      # 第一次真实 CI 就是栽在这里。
      - name: "准备钉死版 mosdns (事务候选校验要真启动它; 版本与 SHA256 走 lib/versions.sh)"
        run: sudo -E bash tests/prepare-mosdns.sh


      - name: Python 语法 (py_compile)
        run: python3 -m py_compile deploy/bot/*.py tests/*.py

      - name: Shell 语法 (bash -n)
        run: |
          bash -n install.sh uninstall.sh \
            deploy/bot/*.sh deploy/cert/*.sh lib/*.sh

      - name: JSON 模板渲染后可解析
        run: |
          set -euo pipefail
          render() {
            sed -e 's|__SERVER_IP__|203.0.113.1|g' \
                -e 's|__INTERNAL_CIDR__|172.22.0.0/16|g' \
                -e 's|__CERT_DIR__|/etc/mosdns/certs|g' \
                -e 's|__SSH_PORT__|22|g' "$1"
          }
          for t in deploy/singbox/config.json.tmpl; do
            echo "→ 渲染并校验 $t"
            render "$t" | python3 -m json.tool > /dev/null
            # jq 在 ubuntu-latest 默认就有, 再用它复核一遍
            if command -v jq >/dev/null; then render "$t" | jq -e . > /dev/null; fi
            echo "  OK"
          done

      - name: mobileconfig 模板是合法 plist/XML
        run: |
          python3 - <<'PY'
          import plistlib, glob, sys
          ok = True
          for f in glob.glob("deploy/ios/*.mobileconfig.tmpl"):
              try:
                  plistlib.load(open(f, "rb")); print("  OK", f)
              except Exception as e:
                  print("  FAIL", f, e); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: systemd unit 静态检查 (best-effort, 不阻断)
        continue-on-error: true
        run: |
          if command -v systemd-analyze >/dev/null; then
            systemd-analyze verify \
              deploy/bot/pdg-bot.service deploy/bot/pdg-health.service \
              deploy/bot/pdg-rules-update.service deploy/bot/pdg-health.timer \
              deploy/bot/pdg-rules-update.timer deploy/bot/pdg-probe81.service || true
            echo "(CI 环境缺二进制/路径, 上面的告警多为预期; 重点看指令拼写/语法错)"
          else
            echo "systemd-analyze 不可用, 跳过"
          fi

      - name: "ShellCheck (阻断: 有 warning 即失败)"
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -q shellcheck
          shellcheck --severity=warning -e SC1091 \
            install.sh uninstall.sh deploy/bot/*.sh deploy/cert/*.sh lib/*.sh tests/*.sh

      - name: "防火墙迁移识别回归 (原装应迁移 / 自定义应跳过)"
        run: bash tests/test-fw-migration.sh

      - name: "mosdns concurrent 迁移回归 (单上游=1/多上游=2/幂等)"
        run: bash tests/test-mosdns-concurrent.sh

      - name: "低内存模式回归 (fixture meminfo 解析/渲染/迁移幂等)"
        run: bash tests/test-lowmem.sh

      - name: "内核激活纪律回归 (假 systemctl+重启模拟: 只起一个内核/失败回滚/unit 无漂移)"
        run: bash tests/test-core-activate.sh

      - name: "sing-box→mihomo 迁移回归 (转不了的出口逐个列名/失败非0且回滚标记/成功清干净/幂等/第三方不删)"
        run: bash tests/test-migrate-drop-singbox.sh

      - name: "unit 写入原子性 (生成函数缺失/失败/空产出都不许截断既有 unit —— 跨版本回滚)"
        run: bash tests/test-write-unit-atomic.sh

      - name: "sing-box 归属保护 (uninstall/--purge 只删本项目装的, 第三方原样保留)"
        run: bash tests/test-singbox-ownership.sh

      - name: "第三方 sing-box 保护 (标准 ExecStart 也不认亲; 迁移/卸载/purge 后 sentinel 不变)"
        run: bash tests/test-singbox-thirdparty.sh

      - name: "平台隔离安装/迁移矩阵 (marker 证据回退/GMS 仅安卓/iOS GMS 清理/服务集按平台; 抽不到函数即 FAIL)"
        run: bash tests/test-platform-install.sh

      - name: "测试自身不许假绿 (抽不到函数/命令不存在/退出码非 0 必须记 FAIL)"
        run: bash tests/test-false-green-guard.sh

      - name: "P2 运行时缺陷回归 (锁 stderr / 快照提交 / start-limit / 已是最新短路)"
        run: bash tests/test-p2-runtime-fixes.sh

      - name: "SSH 来源限制必须活过模板重建 (收紧过的 22 端口不能被更新悄悄开回全网)"
        run: bash tests/test-ssh-source-persist.sh

      - name: "E2E 探针生命周期回归(重复启动/退出/信号/并发/临时目录清理)"
        run: bash tests/test-e2e-probe-lifecycle.sh

      # 6.1A: 只读的链路准备状态。三支分别盯模型/采集器/平台隔离 —— 最怕的是"把不知道
      # 说成知道", 所以 NOT_OBSERVED 与退出码的关系单独有断言。
      - name: "链路诊断状态模型 (六状态闭集/未登记 code 拒绝/NOT_OBSERVED 不算故障/退出码)"
        run: python3 tests/test-link-model.py

      - name: "事务 id 可排序 (同秒多笔不再靠随机后缀定顺序)"
        run: python3 tests/test-txid-ordering.py

      - name: "doctor: 冲突制造者定位 + Tailscale 卸载残留"
        run: python3 tests/test-doctor-conflict-creator.py

      - name: "tailnet 直连端口: 证据等级与 PORT= 解析语义(无结论不得染绿)"
        run: python3 tests/test-tailnet-port-evidence.py

      - name: "内网面板门一: 子网路由重叠拒绝(含每条判据的空测)"
        run: python3 tests/test-lanroute.py

      - name: "内网面板门二: 面板表校验 + 反代生成(改写指令的空测)"
        run: python3 tests/test-lanpanel.py

      - name: "内网面板接线: 面板规则必须排在反自环 REJECT 之前(含空测)"
        run: python3 tests/test-lan-wire.py

      - name: "内网面板自检: 四项判据的每条分支(含 ACL 探测的三种读法)"
        run: python3 tests/test-lan-doctor.py

      - name: "主防火墙重载的唯一入口(裸调会把内网面板白名单冲掉而不补回)"
        run: bash tests/test-lan-nft-chokepoint.sh

      - name: "反代重载的唯一入口(admin off 下 reload 必败, 只生成不重启=进程用着旧的)"
        run: bash tests/test-lan-proxy-reload-chokepoint.sh

      - name: "Location 改写: 真 Caddy 打真响应头(静态测试证明不了头被改了)"
        run: bash tests/test-lan-location-live.sh

      - name: "内网面板门四: 受管反代路由与面板表双向对账(回滚后的静默漂移)"
        run: python3 tests/test-lan-proxy-drift.py

      - name: "内网面板回滚收敛: 派生产物跟随已恢复的模型, 且 render/apply 不假成功"
        run: bash tests/test-lan-rollback-convergence.sh

      - name: "链路诊断采集器 (证书正常/临期/过期/错域名/损坏/误放私钥; 零写入零写锁)"
        run: python3 tests/test-link-status.py

      - name: "链路诊断平台隔离 (Android 不要求 probe81 / iOS 检查它 / 文案不串台)"
        run: python3 tests/test-link-platform.py

      - name: "probe81 转公共组件 (install/update/迁移/平台切换/doctor/卸载 全链路)"
        run: python3 tests/test-probe81-platform.py

      # .153 真机: 运行模块与 CLI 同步到新版本、$REPO_DIR 却还停在旧 commit 时, 迁移在第一行
      # 守卫静默 return 0 —— unit 没装出来, 整条链路却收到"成功"。probe81 已是两平台公共
      # 必需件, 模板缺失现在是硬失败。
      - name: "probe81 迁移 fail-closed (缺 unit 模板必须非零且零写入; 失败逐层传播)"
        run: python3 tests/test-probe81-migrate-failclosed.py

      - name: "链路会话: token/TTL/单次消费/限流/隐私 + root↔DynamicUser 文件交接"
        run: python3 tests/test-link-session.py

      - name: "mosdns DNS 证据闸门 (API 暴露面: 阶段 3 因缓存导出/投喂端点停止)"
        run: python3 tests/test-link-dns-evidence.py

      # 6.2A DoT 证据源。这六支是纯 Python, 不需要真 mosdns/systemd, 所以留在 lint;
      # 需要真内核与真 systemd 的三支在下面各自成 job(e2e-dot / dot-systemd)。
      # tests/helpers/dns-{stub,client}.py 是那两支 E2E 用的库, 没有断言输出,
      # 不作为独立测试登记; tests/negctl/ 下的负控按项目惯例是本地手动门。
      - name: "DoT 证据端契约 (SNI + 探测后缀双守卫; 只认 24 位小写 hex)"
        run: python3 tests/test-dot-witness.py
      - name: "DoT 配置输入闭包 (占位符都有生产者; witness 端口单一真源)"
        run: python3 tests/test-dot-render.py
      - name: "DoT 隐私与边界门 (每条判据先过反向夹具, 防扫不到也绿)"
        run: python3 tests/test-dot-privacy.py
      - name: "DoT 故障矩阵 (DNS parser 25 格 + 状态文件 24 格 + 原子写)"
        run: python3 tests/test-dot-faults.py
      - name: "DoT evidence 校验闭集与配置缺失时启动 fail-closed"
        run: python3 tests/test-dot-strict.py
      - name: "DoT 测试卫生 (异常/SystemExit/中断都要清掉临时目录)"
        run: python3 tests/test-dot-tmpguard.py
      - name: "6.2B 会话关联与三态语义 (观察端不可用时永不 OBSERVED)"
        run: python3 tests/test-dot-session.py
      - name: "6.2B evidence 留存期必须覆盖窗口+结算余量 (否则 NOT_OBSERVED 不可达)"
        run: python3 tests/test-dot-ttl.py
      # 下面两支只读源码, 不碰 systemd/网络, 所以留在这个轻量 job 里。
      - name: "6.2B witness 生命周期接线 (装机闭包/enable 门/卸载/doctor 分级与严重级)"
        run: python3 tests/test-dot-lifecycle.py
      - name: "6.2B 迁移矩阵子集选择器必须 fail-closed (误设不许静默只跑一部分)"
        run: python3 tests/test-dot-matrix-selector.py
      - name: "6.2B 受管块标记契约 (state/strip 同一套精确语义, 九种变体)"
        run: python3 tests/test-dot-route-markers.py

      - name: "witness 迁移的失败理由 (每条出口都可定位 / 缺失与非法分开 / 不回显域名)"
        run: python3 tests/test-dotwitness-error-reasons.py
      # 这支的动态段要真跑 `nft -c`, 非 root 下 nft 连缓存都初始化不了 —— 会自报 SKIP
      # 并说明原因(不算通过)。用 sudo 跑, 让那段真正当裁判; runner 上 nft 是现成的。
      - name: "nft 模板渲染点必须替换每一个占位符 (含真 nft -c)"
        run: |
          set -euo pipefail
          out="$(sudo -n python3 tests/test-firewall-render-tokens.py)"
          echo "$out" | tail -3
          echo "$out" | grep -qE '失败 0, 跳过 0$' \
            || { echo "渲染门有失败, 或动态 nft -c 段被跳过了"; exit 1; }

      - name: "链路会话证据接进 linkstat (NOT_OBSERVED/PASS/STALE 语义与退出码隔离)"
        run: python3 tests/test-link-live.py

      # 逐处钉字面量管不住"下一处新写的文案"。这道闸门从用户真正看到的输出入手, 统一扫
      # 越界结论(SIM/APN/DoT/整体联网正常), 并守住 NOT_OBSERVED 不被写成故障。
      - name: "手机侧证据的结论上限 (越界结论闸门 + NOT_OBSERVED 不是故障)"
        run: python3 tests/test-link-copy-boundary.py

      # 6.1C 把会话接进 Bot。判据不在"功能跑得通", 而在接的过程中有没有把 6.1B 的克制
      # 弄丢: token 只在一次性按钮里、结论不越界、状态机只有一份、整条路只读。
      - name: "Bot 手机链路测试 (token 只在按钮/结论上限/只读/并发与故障释放)"
        run: python3 tests/test-link-bot.py

      # .153 真机 P0: probe81 以 DynamicUser 跑, 读不到 0600 root 的 profile.env, 于是
      # "来源在不在内网卡段"这条证据永远产不出来。判据只能落在**真的换 UID**上 —— 同一个
      # uid 下怎么测都是空转。CI 是 root 容器, 严格模式下 SKIP 判失败。
      - name: "链路会话跨 UID 边界 (真 setuid: 会话快照网段 / 不读 profile.env / schema fail-closed)"
        run: python3 tests/test-link-profile-uid.py

      # 夹具自己漏资源, 会以"产品偶发失败"的样子冒出来 —— 判据落在真实线程/端口/目录上。
      - name: "txbox 探针生命周期 (clean 后线程必须退出/端口必须释放/50 个 Box 回到基线)"
        run: python3 tests/test-txbox-probes.py

      - name: "负控字节码缓存隔离(同一秒改坏/恢复源码不得读到陈旧 .pyc)"
        run: python3 tests/test-pycache-isolation.py

      # 判法是"私有 TMPDIR 跑一遍, 跑完必须是空的" —— 不按前缀扫 /tmp 删(那删的是并发中
      # 别人的沙箱)。同时盯失败路径(异常/非 0/SIGTERM)与 PDG_KEEP_TMP 留现场。
      - name: "临时物卫生 (一支测试跑完不许留下自己建的临时目录; PDG_KEEP_TMP=1 才留现场)"
        run: python3 tests/test-tmp-hygiene.py

      - name: "E2E 影子桩生命周期 (ip/python3 桩不许活过进场与退出清理)"
        run: bash tests/test-e2e-shadow-stub.sh

      # 判据是**逐调用点**的: 只数"这个文件里有守卫"会放过"守卫写在动作之后"和"这两行前面
      # 根本没有守卫"—— 2026-08-02 开发者 origin 被改指到 /tmp 裸库正是后一种。
      - name: "e2e 不许碰共享 git ref 库 (复现 07-31 丢 tag/remote + 08-02 改坏 origin; 逐调用点核对)"
        run: python3 tests/test-e2e-repo-guard.py

      - name: "GMS 推送端口迁移回归 (fw/sing-box 补 5228-5230, 自定义跳过, 失败回滚)"
        run: bash tests/test-gms-migration.sh

      - name: "v1.4.x→WLOC 迁移回归 (补 force_hijack/seq/优先级规则/mitm_hijack, 幂等/自定义跳过/失败还原)"
        run: bash tests/test-mitm-migration.sh

      - name: "parse_link 多协议回归 (各协议链接 + Surge ss 行字段映射)"
        run: python3 tests/test-parse-links.py

      - name: "内网卡段取值回归 (真 pty: 抓包/手输并行谁先用谁 + 形态校验 + 半截输入不漏)"
        run: python3 tests/test-cidr-input.py

      - name: "老机器 unit 重部署 (sing-box 悬空依赖换 mihomo / 保住装机 CERT_DIR / 幂等)"
        run: bash tests/test-unit-redeploy.sh

      - name: "内核版本精确匹配 (v1.19.1 不得匹配 v1.19.10; 读不到版本不跳过安装)"
        run: bash tests/test-version-match.sh

      # 这是**静态守卫**(只核对源码里的标识符), 不是端到端。真实行为覆盖在
      # e2e-update.sh 与 e2e-upgrade-from-release.sh —— 名字必须说实话。
      - name: "发布链路静态守卫 (源码标识符核对; 真实行为见 e2e-update / e2e-upgrade-from-release)"
        run: bash tests/test-release-flow.sh

      - name: "更新快照+精确回滚回归 (--dir 精确目标/--git 复位/部分失败不谎报/快照覆盖脚本)"
        run: bash tests/test-update-rollback.sh

      - name: "update 关键步骤故障注入 (git reset/必需文件/迁移/内核/daemon-reload 失败均回滚且不谎报成功)"
        run: bash tests/test-update-faults.sh

      - name: "全局锁继承八格 (父锁复用/独立取锁/BUSY/环境变量伪造/错文件/inode 变更/并发/释放)"
        run: bash tests/test-lock-inherit.sh

      - name: "内核热切回归 (check/重启不稳定均还原旧核; 稳定后才删 .prev; 快照含内核二进制)"
        run: bash tests/test-core-swap.sh

      - name: "install 回滚回归 (set -u 下不因未初始化变量二次崩溃; 系统级还原完整; 只删本次新装)"
        run: bash tests/test-install-rollback.sh

      - name: "install 二进制事务回归 (备份失败即中止/半截安装可恢复/强制重装也还原/清理失败不假报)"
        run: bash tests/test-install-bintxn.sh

      - name: "bot 导航回归 (操作结果不刷一级菜单)"
        run: python3 tests/test-bot-nav.py

      - name: "WDA mihomo 切换回归 (内联域名规则/开关幂等/老 rule_set 迁移)"
        run: python3 tests/test-wda-mihomo.py

      - name: "bot 凭据保护/后台执行器/BUSY 锁回归"
        run: python3 tests/test-bot-credential.py

      - name: "备份恢复解包安全 (绝对路径/../symlink/hardlink/设备/FIFO/压缩炸弹均不得越界)"
        run: python3 tests/test-restore-tar-safety.py

      - name: "恢复备份事务化 (内核校验/dropped/mosdns/内核起不来: 全部目标逐字节还原)"
        run: python3 tests/test-restore-transaction.py

      - name: "观测面板回归 (zashboard 开关 + clash_api secret)"
        run: python3 tests/test-panel.py

      - name: "面板快照/回滚净化回归 (secret 不入档)"
        run: bash tests/test-panel-snapshot.sh

      - name: "规则集完整性 (dropped 非空即拒/.srs 拒/真实 YAML provider + 真实 .mrs fixture 走本地 HTTP)"
        run: python3 tests/test-ruleset-integrity.py

      - name: "bot 测域名规则集显示名回归"
        run: python3 tests/test-domain-label.py

      - name: "出口改名级联回归 (规则/故障组/final/TG 同步)"
        run: python3 tests/test-exit-rename.py

      - name: "iOS 描述文件回归 (Wi-Fi 探测判定 + SSID 直连名单)"
        run: python3 tests/test-ios-ssid.py

      - name: "iOS 描述文件现状特征化 (随机身份 / Bot 与 CLI 的分歧)"
        run: python3 tests/test-ios-profile-legacy.py

      - name: "iOS 描述文件统一生成器 (Bot 与 CLI 逐字节一致 + 私钥零外泄)"
        run: python3 tests/test-ios-profile-shared.py

      - name: "iOS 描述文件生命周期 (稳定身份 / 三档判定 / 事务原子性)"
        run: python3 tests/test-ios-profile-lifecycle.py

      - name: "iOS 描述文件交互 (Bot/CLI 同一份记录 + 不声称设备状态 + Android 全拒)"
        run: python3 tests/test-ios-profile-ux.py

      - name: "iOS 描述文件身份持久性 (update/快照/备份恢复/平台来回切都不丢身份)"
        run: python3 tests/test-ios-profile-persist.py

      - name: "iOS 描述文件产物完整性 (缺失/损坏/串位必须检出, 发送前一律 fail-closed)"
        run: python3 tests/test-ios-profile-integrity.py

      - name: "iOS 描述文件恢复闭环 (快照/备份逐字节恢复 + 旧格式备份 + 失败整组回滚)"
        run: python3 tests/test-ios-profile-restore.py

      - name: "iOS 描述文件并发 (整段读-改-写一把锁 + 标记发送认版本, 不丢更新)"
        run: python3 tests/test-ios-profile-concurrency.py

      - name: "iOS 备份恢复联合校验 (三件套当一组验 + 只放行本项目会生成的 payload)"
        run: python3 tests/test-ios-profile-backup-trust.py

      - name: "iOS 快照精确回滚 (回滚不留孤儿产物 + 备份按记录而不是按盘上有什么打包)"
        run: python3 tests/test-ios-profile-snapshot-exact.py

      - name: "iOS 首次启用不许猜 (发 SSID 也要先问装没装过, 没回答就一个字节都不写)"
        run: python3 tests/test-ios-profile-firsttime.py

      - name: "iOS 恢复计划三入口共用 (Bot/救援平面/CLI 回滚同一份判据, 缺失即删除)"
        run: python3 tests/test-ios-profile-restore-plan.py

      - name: "iOS 根证书必须恰好是一张 DER (证书后拼私钥/垃圾字节一律拒, 四条可信路径同一道门)"
        run: python3 tests/test-ios-ca-der-exact.py

      - name: "iOS schema 1 可信契约 (输入必须是规范形式 + 固定显示名 + 身份与时间; 恢复/健康/发送同一份判据)"
        run: python3 tests/test-ios-profile-schema-contract.py

      - name: "iOS 元数据契约四入口一致 (load/恢复/健康/发送同一份完整判据 + 校验的字节就是返回的字节)"
        run: python3 tests/test-ios-profile-meta-contract.py

      - name: "自检防火墙端口回归 (泄露判据/缺 7893/代理入口/GMS 分档/端口文案按平台)"
        run: python3 tests/test-doctor-firewall.py

      # 6.1C: doctor 与 linkstat 曾对同一台健康机器给出相反结论 —— doctor 报 0 失败,
      # linkstat 判 FAIL 并拦住手机测试会话。根因是两套各自为政的文本近似判据。这三支
      # 盯的就是"只有一份判据, 并且分档不串":
      # 沙箱 nft 桩的契约。它以前对 `-j` 返回空, 于是 nftlive 按设计 fail-closed, 更新后
      # 自检判红整次回滚 —— 而最顺手的"修法"恰恰是把 fail-closed 降成 WARN。桩得有人看着。
      - name: "沙箱 nft 桩契约 (状态派生而非常量/表不在非零/空输入仍 fail-closed/双平台不串台)"
        run: python3 tests/test-nftjson-stub.py

      # bind 是监听地址配置, `pdg rescue disable` 保留它是既定行为。拿它当"启没启用"用,
      # 停用过救援平面的机器会被判成"已启用却没放行" → doctor fail → 更新整次回滚。
      - name: "救援启用判据状态矩阵 (只看 PDG_RESCUE_ENABLED/停用后残留仍要发现/值损坏 fail-closed)"
        run: python3 tests/test-rescue-intent-matrix.py

      # `.153` 真机一天内撞到三次同一形状: 读不到必需的值时塞个占位符继续走, 下游拿着必然
      # 不成立的东西干活, 界面却一切正常。占位符比"不知道"更糟 —— 它看起来像个答案。
      - name: "缺值必须如实说 (PDG_SERVER_IP fail-closed / DoT 域名不吞成 ? / probe81 两平台公共)"
        run: python3 tests/test-missing-value-honesty.py

      # 盘上是新代码、跑着的是旧的 —— 从版本号和文件内容看都"已升级", 只有进程还是旧的。
      # 两天里手工部署踩了两次(菜单缺项 / RuntimeDirectory 没生效)。
      - name: "换过模块必须重启用它们的服务 (内容变才转/try-restart/失败不转)"
        run: bash tests/test-deploy-restart.sh

      # 部署顺序三格行为矩阵: 直接 __migrate(装+重启)、提前装模块再迁移(判据被掏空)、
      # cmd_update 迁移之后那段(无条件重启)。jp2 上"盘上新代码进程还是旧的"就出在中间那格。
      - name: "部署顺序矩阵 (直接迁移 vs 提前装模块 vs cmd_update; SOP 守卫)"
        run: bash tests/test-deploy-order.sh

      # 链路测试那几屏的退出键必须指回它自己的来处(入口挂在「客户端接入」下)。
      # 真机上用出来的: 从「📱 客户端」进去, 退出被送到「🩺 自检」那条不相干的支路。
      - name: "链路测试退出键指回入口菜单 (四屏一致/不回自检/保留主菜单)"
        run: python3 tests/test-link-nav.py

      # jp2 上定时器停摆 8 天而 doctor 一路判绿 —— 那时它根本没有这一项。
      # 判据不能只看 enabled/active/failed 三态, 必须看有没有下一次触发时间。
      - name: "健康自检定时器判据 (elapsed+infinity 必须 FAIL / 正在跑不误报 / 只读)"
        run: python3 tests/test-health-timer-doctor.py

      # .153 上 mosdns 读 /etc/dnsdist/certs 而续期钩子写 /etc/mosdns/certs, 靠一个看着
      # 该被清理的老钩子兜着。这种错在证书到期前毫无征兆: 文件在、没过期、续期成功、
      # doctor 全绿, 到期当天 DoT 对所有手机同时失效。
      - name: "证书路径一致性 (钩子写的目录必须就是 mosdns 读的目录; 缺省值与钩子同源)"
        run: python3 tests/test-cert-dir-sync.py

      # Tailscale 节点地址与运营商 SIM/APN 都用 100.64.0.0/10 —— 只看源地址分不开。
      # 判据必须同时看入口接口, 所以这支用真 netns + 真 veth + 真 nft 加载 + 真流量;
      # 两侧客户端地址都在同一个配置段内, 换源 IP 冒充不了。环境不足会 SKIP 并说明原因。
      - name: "Tailscale 入口隔离 (真 netns: tailnet 不进数据面, 物理 CGNAT 照旧)"
        run: sudo -n python3 tests/test-tailscale-ingress-isolation.py

      - name: "detect-cidr 不得把 tailnet 推成内网段 (按入口接口排除 / 拿不到接口就拒绝猜)"
        run: python3 tests/test-detect-cidr-tailscale.py

      # 模板改了却传不到已装机器上 —— 那条缺口让 v1.10.1→本分支的升级在六个 E2E 里同时红。
      - name: "防火墙按模板重建 (已迁移的机器也要收到模板改动; 参数反解 fail-closed)"
        run: sudo -n python3 tests/test-firewall-template-sync.py

      # 磁盘已是新版而内核仍跑旧规则 —— 据磁盘判 no-op 会让防火墙停在旧规则上。
      - name: "防火墙磁盘/内核漂移 (C 态只 reload 不写盘; B 态真 no-op; 失败注入)"
        run: sudo -n python3 tests/test-firewall-live-drift.py

      # 转换器认不出的匹配会被静默丢弃, 判据据此看不见内核里确实存在的规则。
      - name: "nftjson 表达式覆盖 (iifname 等匹配不得在转换时丢失)"
        run: python3 tests/test-nftjson-coverage.py

      # 夹具渲染不全会造出"不像真机"的沙箱: 漏一个占位符, 参数反解就失败。
      - name: "E2E 夹具模板渲染闭包 (模板每个占位符夹具都得替换)"
        run: python3 tests/test-e2e-seed-render.py

      # jp 停在旧模板上, 救援端口只出现在注入规则里(saddr 与 dport 之间还有 ip daddr),
      # 只按当前模板形状反解 → 一条都匹配不到 → 同步跳过 → 更新每次回滚。
      - name: "救援端口反解 (注入形态与模板独立行都要认; 真多端口才算多值)"
        run: bash tests/test-rescue-port-derivation.sh

      # jp 上 certbot 每失败一次就多积一条 80 放行, 积到两条时 doctor 判红、升级整次回滚。
      - name: "证书续期钩子 (加在哪就能从哪撤; 有 nft 却解析不到时不许落 iptables)"
        run: bash tests/test-cert-hook-cleanup.sh

      # 本地只查几个手挑的文件, 新增的 tests/*.sh 就永远进不了门 —— 本地全绿, CI 判红。
      - name: "ShellCheck 范围守卫 (本地门必须与 CI 同范围, 范围从 ci.yml 读出)"
        run: bash tests/test-shellcheck-scope.sh

      - name: "Tailscale 入口隔离 负控 (撤排除/挪顺序/过度排除必须转红; 无关注释仍绿)"
        run: sudo -n python3 tests/negctl/tailscale-isolation-negative-controls.py

      # 真 systemd: 死角复现、状态机、故障注入。容器里跑, 非 root 环境 SKIP(严格模式判失败)。
      - name: "健康自检定时器 真 systemd (死角/状态机/6 种故障注入; 环境不足则 SKIP)"
        run: sudo -E bash tests/e2e-health-timer.sh

      # 共享 systemctl 桩的契约。它是测试基础设施: 坏了不会有人报警, 只会让上层测试
      # 悄悄变成恒绿。最危险的不是"答不出属性"(那会 fail-closed 判红, 看得见),
      # 而是"无条件回答健康值" —— 那时 timer 死角那组测试永远是绿的。
      - name: "共享 systemctl 桩契约 (多个 -p/KEY=VALUE/乱序/四种状态/故障注入)"
        run: sudo -E env PDG_E2E_ISOLATED=1 bash tests/test-systemctl-stub.sh

      - name: "nft 语义判据 (nft 自身规范化不算漂移: 集合折叠/reject 默认展开/协议别名)"
        run: python3 tests/test-nft-live-semantics.py

      - name: "nft 调用链 (doctor 与 linkstat 对同一状态结论一致, 不拦住建会话)"
        run: python3 tests/test-nft-callchain.py

      - name: "nft 条件与故障矩阵 (15 格条件 × 20 格故障 × 三条链路; 专项故障不进链路硬门)"
        run: python3 tests/test-nft-matrix.py

      - name: "nft input 链冲突判据 (单一来源 + 读不到≠没有 + platform 守卫不靠 PATH 找 nft)"
        run: python3 tests/test-nft-input-scan.py

      - name: "配置事务核心 (状态机/白名单/前置检查/观察期/回滚/审计/runner 固定)"
        run: python3 tests/test-config-transaction.py

      - name: "配置事务安全边界 (路径穿越/软硬链接/权限/凭据脱敏/恢复漂移保护)"
        run: python3 tests/test-config-transaction-security.py

      - name: "配置事务故障注入 (锁 fail-closed/并发/before-image/部分替换/回滚失败)"
        run: python3 tests/test-config-transaction-faults.py

      - name: "内网卡段真源 (profile.env 权威 / 漂移检出 / 迁移保守)"
        run: python3 tests/test-cidr-single-source.py

      - name: "内网卡段变更事务化 (候选生成/校验门/观察期/回滚/ROLLBACK_FAILED/锁忙)"
        run: python3 tests/test-cidr-transaction.py

      - name: "救援常量单一事实源 (端口/路径两侧一致, 全仓无字面量)"
        run: bash tests/test-rescue-constants.sh

      - name: "救援平面只读骨架 (真起 HTTPS: 前提缺失拒启动/未认证 401/无外部资源/路径穿越)"
        run: python3 tests/test-rescue-server.py

      - name: "救援平面凭据与认证 (凭据不重建/CSRF/限速锁定/会话上限/轮换即失效)"
        run: python3 tests/test-rescue-auth.py

      - name: "救援平面 socket 交接与抗畸形请求 (fd3 接管/四类不自洽拒启动/打不崩)"
        run: python3 tests/test-rescue-socket.py

      - name: "救援平面 recover (枚举 txid/确认/CSRF/锁忙/漂移不覆盖/如实报告)"
        run: python3 tests/test-rescue-recover.py

      - name: "恢复触发来源审计 (旧签名兼容/rescue 与 cli 各记各的/参数伪造无效/并发只跑一个)"
        run: python3 tests/test-tx-recover-source.py

      - name: "救援平面配置恢复 (只换受管配置/快照边界/摘要复核/nonce 一次性/失败全回滚)"
        run: python3 tests/test-rescue-cfgrestore.py

      - name: "受管恢复的表单闭环 (照页面原样提交/证书固定/confirm 必勾/nonce 一次性且绑会话)"
        run: python3 tests/test-rescue-formflow.py

      - name: "恢复的服务动作推导 (按变化目标推导/映射唯一/未知即拒/顺序固定)"
        run: python3 tests/test-restore-actions.py

      - name: "救援平面紧急完整恢复 (救援入口自保/pre-rescue 强制/结构化结果/不自动降级)"
        run: python3 tests/test-rescue-breakglass.py

      - name: "旧结构强确认与降级边界 (LEGACY- 双条件/票绑结构版本/旧核心不支持不报500)"
        run: python3 tests/test-rescue-legacy-confirm.py

      - name: "渲染链特征基线 (mrs/zstd behavior 真值表 + rulesets 分类 + 逐字节锚点)"
        run: python3 tests/test-render-characterize.py

      - name: "共享渲染模块独立性 (bot 损坏/缺席/禁 import 时仍出候选 + monkeypatch 点仍生效)"
        run: python3 tests/test-render-shared.py

      - name: "rule_set 数组形态 (字符串逐字节不变/数组按序展开/非法形态 fail-closed)"
        run: python3 tests/test-ruleset-array.py

      - name: "渲染判废默认安全 (pdgtx 缺失/损坏/旧版时 str/repr/审计均不含用户值)"
        run: python3 tests/test-render-refusal.py

      # 需要真内核的测试共用这一份: 下一次、按 lib/versions.sh 的 SHA256 校验一次, 放到
      # tests/.bin/。CI 上必须**严格模式** —— 缺二进制要判失败, 不许把关键校验变成绿灯跳过。
      - name: "准备钉死版 mihomo (SHA256 校验, 供需要真内核的测试共用)"
        run: bash tests/prepare-mihomo.sh

      - name: "混合规则 AND 语义 (跨字段 AND/同字段 OR/不支持组合拒绝/真 mihomo -t)"
        run: python3 tests/test-rule-mixed.py

      # 断言的是**真内核的判定**: 把渲染出来的配置交给钉死版 mihomo 跑起来, 从它自己的匹配
      # 日志与 clash_api /rules 读出"这个域名去了哪个出口" —— 与 .200 现场同一种取证方式。
      - name: "分流优先级 (点名规则不被 WDA/MITM 自动规则压过; 真内核判定 + doctor 可见)"
        run: python3 tests/test-rule-precedence.py

      - name: "紧急默认出口 (只改 route.final/三目标同事务/原值不被覆盖/stale 拒绝)"
        run: python3 tests/test-emergency-exit.py

      # 10b 硬门: 需要真 systemd(PID 1) + 真 nft + root。runner 上三者齐备就真跑;
      # 缺任何一样脚本自己 [SKIP] 并说明 —— 但**跳过不等于验收**, 正式记录在
      # docs/rescue-plane-acceptance.md, 那里只写真跑过的结论。
      - name: "救援平面 10b 硬门 (真 socket activation/硬化/真 nft; 环境不足则 SKIP)"
        run: sudo -E bash tests/e2e-rescue-10b.sh

      # 真 systemd: 死角复现、迁移状态机、故障注入。非 root 环境 SKIP(严格模式判失败)。
      - name: "健康自检定时器 真 systemd (死角/状态机/6 种故障注入; 环境不足则 SKIP)"
        run: sudo -E bash tests/e2e-health-timer.sh

      # 共享 systemctl 桩的契约: 它坏了不会有人报警, 只会让上层测试悄悄变成恒绿。
      - name: "共享 systemctl 桩契约 (多个 -p/KEY=VALUE/乱序/四种状态/故障注入)"
        run: sudo -E env PDG_E2E_ISOLATED=1 bash tests/test-systemctl-stub.sh

      - name: "运行模块安装闭包 (真实入口传递依赖 vs 安装真源, 含动态导入点)"
        run: python3 tests/test-install-closure.py

      # 以下六条此前**从未进过 CI** —— 其中四条是 5.2 这一路新写的。本地跑得好好的, 远端
      # 一次没跑过。tests/test-ci-coverage.py 现在会盯着这件事: 有测试文件没出现在本文件里
      # 就判红, 免得"写了用例"和"用例真的在跑"再次被当成一回事。
      - name: "跨版本快照矩阵 (清单取自各版本 cmd_snapshot; unknown/legacy/特征冲突 fail-closed)"
        run: python3 tests/test-snapshot-matrix.py

      # 基准取的是 `git show v1.7.0:` 的真实产物 —— 所以这条也吃 fetch-depth: 0。
      - name: "明确代理优先级 (v1.7.0 模板幂等补齐/顺序自检/fail-closed + 事务回滚 + doctor 点名)"
        run: python3 tests/test-mosdns-explicit-proxy.py

      # 全新 Debian 13 装不上的第二个报障: 装机时 mosdns 还没起、53/853 还没人听, 事务的
      # normal 模式把这当成"组件坏了"直接拒写 geosite; 规则文件因此一个都没落盘, mosdns 缺
