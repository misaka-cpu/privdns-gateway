#!/usr/sbin/nft -f
# PrivDNS Gateway 防火墙 —— mihomo 内核(v1.6.0 起唯一内核, 唯一 nft 模板)。
# mihomo 没有裸 accept+sniff 的入站, 只有 redir/tproxy 透明代理监听器, 且直连监听端口会触发
# 环路自保被丢弃 —— 故这里加 nat prerouting, 把内网来源的 80/443/5228-5230 REDIRECT 到
# mihomo 的 redir 端口(7893)。mihomo 靠 SO_ORIGINAL_DST 拿回原始 443/80/5228 再嗅 SNI 分流。
#
# 安全要点: REDIRECT 只匹配 `ip saddr __INTERNAL_CIDR__`(内网卡来源), 所以
#   - certbot HTTP-01 挑战来自 Let's Encrypt(外部来源), 不会被劫持, 证书续期不受影响;
#   - 公网扫描/非内网来源一律走 input 的 default-drop。
# install.sh 渲染占位符: __SSH_PORT__(SSH 端口, 跟 sshd 的 Port 一致, 否则一应用即锁死)、
# 另有两个联动的占位符(名字见下面 SSH 那条规则处的注释, 这里不写全名 —— 头部这几行会被
# 渲染一起替换掉, 写了反而变成一段被替换后的乱码)。
# __INTERNAL_CIDR__(内网卡来源段)、__RESCUE_PORT__(救援平面端口, 来自 lib/rescue.sh)。
# 注意: 这里**不写**具体网段/端口的字面量 —— 渲染后它会变成一个会过期的注释, 而 detect-cidr
# 换段时只改功能规则, 注释就此说谎。要看当前值请读下面的规则本身或 profile.env。
# 只用独立表 inet pdg, 不 flush 全局; 先 declare 再 delete 保证只重建本表。
table inet pdg
delete table inet pdg

table inet pdg {
    # 内网来源的被劫持端口 → mihomo redir(7893)。dstnat 优先级早于 filter input。
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Tailscale 节点地址来自 100.64.0.0/10, 运营商 SIM/APN 也合法用同一个段(RFC 6598),
        # 所以**只看源地址分不开这两者**。真正的判据是"从哪个接口进来": 从 tailscale0 来的
        # 一律不进数据面。必须排在下面的来源匹配之前 —— 先匹配再排除等于没排除。
        # 用 iifname 不用 iif: iif 在加载时把接口名解析成索引, 接口不存在会让整份规则加载
        # 失败, 而生产机在装 Tailscale **之前**就得能加载这份规则。iifname 是运行时按名字比,
        # 没有该接口时它只是永不命中, 行为与本改动前逐条相同。
        iifname "tailscale0" return
        ip saddr __INTERNAL_CIDR__ tcp dport { 80, 443, 5228-5230 } redirect to :7893
    }
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        # __SSH_MATCH__ 是**来源匹配前缀**, 渲染成两者之一:
        #   空          → 对全网放行(默认, 与历史行为逐字一致)
        #   iifname "tailscale0" → 只允许经 tailnet 登录, 公网上看不到这个端口
        # 收紧之前必须先确认 tailnet 这条路真的通 —— 否则这一行一应用就是把自己锁在门外,
        # 只剩服务商的网页控制台。切换走 `pdg ssh-source`, 它带前置检查与自动回退。
        __SSH_MATCH__tcp dport { __SSH_PORT__ } accept
        # Tailscale 的直连端口(UDP 41641, 官方默认)。**只在 SSH 收紧为 tailnet 时才放行** ——
        # 两者是同一个决定的两半, 不是两个独立开关:
        #
        # 不放行的话, 入站的打洞包会被本链 policy drop 丢掉, 直连只能靠对方主动外联时
        # conntrack 留下的条目撑着。条目一过期(空闲几分钟就会), 入站就死, 下一次连接得等
        # tailscaled 从 DERP 绕一圈重新打洞 —— 实测第一次 SSH 必超时, 重试才通。
        # 那个冷启动窗口恰恰是最需要它的时刻: 几小时没用 tailnet, 出事了想连进去。
        # 如果那时公网 SSH 已经关了, 现场看起来就是"机器挂了"。
        #
        # 收到的是 WireGuard 密文, tailscaled 自己做认证, 不合法的包直接丢 —— 这也是
        # Tailscale 在公网主机上的标准部署方式。
        # 改过 Tailscale 监听端口(`tailscaled --port`)的话, 这一行要跟着改。
        __TAILNET_DIRECT__
        # ICMP/ICMPv6 放在这里而不是链尾: 它们是**无条件 accept**, 上移跨过的全是按
        # tcp/udp 端口匹配的规则, 而 ICMP 没有端口、本来就不会命中那些规则 —— 所以位置
        # 变了、语义逐条不变。这么排是为了让下面那条 tailnet 排除能同时满足两件事:
        # 保住 ping 这条管理通道的基本可达性, 又把 tailnet 挡在数据面之外。
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        # Tailscale 入口隔离(理由同 prerouting)。位置是刻意的: 排在 SSH 与 ICMP 放行
        # **之后**、所有来源匹配与数据面规则**之前**。于是经 tailnet 的 SSH 与 ping 照常
        # 可用(上面几行已 accept), 而 tailnet 到 53/81/853/7893/8445/救援端口的流量走到
        # 这里就 return, 由本链 policy drop 收口。
        iifname "tailscale0" return
        # 80/443/5228-5230 已在 prerouting 被改写为 7893, 故这里放行 7893(仅内网来源);
        # 53/81/853/8445 仍由各自服务直接监听(mosdns DoT / iOS 探测 / tg-proxy)。
        ip saddr __INTERNAL_CIDR__ tcp dport { 53, 81, 853, 7893, 8445 } accept
        # 救援平面: 只认内网卡来源, 且服务本身只绑内网地址(见 pdg-rescue.socket) —— 两道
        # 约束都在, 公网扫到的只有 input 的 default-drop。
        ip saddr __INTERNAL_CIDR__ tcp dport __RESCUE_PORT__ accept
        ip saddr __INTERNAL_CIDR__ udp dport { 53 } accept
        ip saddr __INTERNAL_CIDR__ udp dport 443 reject   # QUIC/HTTP3: 拒掉, 逼客户端回落 TCP 443(可嗅 SNI 分流)
        # 你自己的放行规则放这里(每个 .conf 一行一条, 如 `tcp dport 80 accept`):
        #     /etc/privdns-gateway/nft-input.d/*.conf
        # 本表每次更新都会按模板重建, 但那个目录不会被碰 —— 手加在本文件里的规则会丢, 加在
        # 那边的不会。用 glob 而不是单个文件: 目录空着也能加载, 删光自己的规则不会把防火墙
        # 整个搞挂(单文件 include 缺文件会让整份配置加载失败, 那就是把自己锁在门外)。
        include "/etc/privdns-gateway/nft-input.d/*.conf"
    }
}
